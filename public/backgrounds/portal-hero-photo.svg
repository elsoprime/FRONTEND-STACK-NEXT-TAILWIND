  <path d="M0 800C202 738 390 804 592 776C776 750 954 670 1160 704C1338 734 1466 838 1634 846C1756 852 1846 826 1920 792" stroke="#C2ADFF" stroke-opacity="0.22" stroke-width="2"/>

  <rect width="1920" height="1080" fill="#FFFFFF" filter="url(#grain)"/>
