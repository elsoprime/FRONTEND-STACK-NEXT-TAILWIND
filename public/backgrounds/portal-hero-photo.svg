<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1524"/>
      <stop offset="0.5" stop-color="#132238"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7EC2FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7EC2FF" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 190) rotate(19) scale(530 340)">
      <stop stop-color="#4D9CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4D9CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1530 810) rotate(-14) scale(600 360)">
      <stop stop-color="#A184FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A184FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <ellipse cx="380" cy="190" rx="530" ry="340" fill="url(#leftGlow)"/>
  <ellipse cx="1530" cy="810" rx="600" ry="360" fill="url(#rightGlow)"/>

  <g opacity="0.42" filter="url(#blurSoft)">
    <rect x="1160" y="108" width="498" height="700" rx="20" fill="#1F3553"/>
    <rect x="1240" y="176" width="246" height="540" rx="16" fill="#253E60"/>
  </g>

  <g opacity="0.55">
    <rect x="1100" y="90" width="560" height="760" rx="26" fill="#1A2C47"/>
    <rect x="1170" y="150" width="420" height="620" rx="18" fill="#243C5D"/>
  </g>

  <g opacity="0.5">
    <rect x="1188" y="172" width="120" height="148" rx="8" fill="url(#windowLight)"/>
    <rect x="1320" y="172" width="120" height="148" rx="8" fill="url(#windowLight)"/>
    <rect x="1452" y="172" width="120" height="148" rx="8" fill="url(#windowLight)"/>

    <rect x="1188" y="336" width="120" height="148" rx="8" fill="url(#windowLight)"/>
    <rect x="1320" y="336" width="120" height="148" rx="8" fill="url(#windowLight)"/>
    <rect x="1452" y="336" width="120" height="148" rx="8" fill="url(#windowLight)"/>

    <rect x="1188" y="500" width="120" height="148" rx="8" fill="url(#windowLight)"/>
    <rect x="1320" y="500" width="120" height="148" rx="8" fill="url(#windowLight)"/>
    <rect x="1452" y="500" width="120" height="148" rx="8" fill="url(#windowLight)"/>
  </g>

  <g opacity="0.55" filter="url(#blurSoft)">
    <ellipse cx="1024" cy="804" rx="140" ry="70" fill="#0E1622"/>
    <ellipse cx="886" cy="836" rx="84" ry="44" fill="#0F1A2A"/>
    <ellipse cx="1208" cy="842" rx="94" ry="48" fill="#111E30"/>
